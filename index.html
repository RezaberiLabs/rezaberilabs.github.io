<style>
:root{--ink:#12161F;--mint:#19D3A2;--fg:#F2F4F7;--muted:#ACB7CD;--lcd:#C7F0D8;--lcd-ink:#43523D}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink)}
body{position:relative;min-height:100vh;min-height:100dvh;overflow:hidden;color:var(--fg);font-family:'JetBrains Mono',ui-monospace,monospace;font-size:14px;display:flex;flex-direction:column;justify-content:space-between;gap:24px;padding:24px;-webkit-tap-highlight-color:transparent}

a{color:inherit}
#field{position:fixed;inset:0;z-index:0;display:block;touch-action:none}
.top,.bottom{position:relative;z-index:1;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;pointer-events:none}
.top{align-items:flex-start}
.panel{pointer-events:auto;background:var(--ink);border-radius:12px;padding:10px 14px}
.word{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:20px;letter-spacing:-.01em;font-weight:800;margin:0}
.word span{font-weight:500}
.about{display:flex;flex-direction:column;gap:4px}
.about p{margin:0;font-size:16px;line-height:1.45}
.about small{font-size:13px;color:var(--muted)}
.mail{display:inline-block;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:clamp(22px,2.6vw,32px);letter-spacing:-.02em;text-decoration:underline;text-decoration-color:var(--mint);text-decoration-thickness:3px;text-underline-offset:6px}
.mail:hover,.mail:focus-visible{text-decoration-color:#fff}
.hud{pointer-events:auto;cursor:pointer;background:var(--ink);color:var(--mint);border:0;border-radius:12px;padding:10px 14px;font:700 15px/1.2 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.14em;display:flex;flex-direction:column;align-items:flex-end;gap:3px;min-height:44px}
.hud[hidden],.hint[hidden]{display:none}
.hint{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 14px}
.hint [hidden]{display:none}
.arrows{display:inline-flex;gap:3px;vertical-align:-2px;margin:0 2px}
.arrows svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.hud small{font-weight:500;font-size:11px;letter-spacing:.1em;color:var(--muted)}
.fade{animation:fade .9s ease-out 1.6s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}

<script>
(function () {
  'use strict';
  var cv = document.getElementById('field');
  var ctx = cv.getContext('2d');
  var hud = document.getElementById('hud');
  var hint = document.getElementById('hint');
  var hudMain = document.getElementById('hud-main');
  var hudSub = document.getElementById('hud-sub');
  var R = ['XXXL.', 'X...X', 'X...X', 'XXXX.', 'X.X..', 'X..X.', 'X...X'];

  // [brand colour, Nokia LCD colour]; the field cross-fades between them while the game runs
  var C = {
    bg:    [[18, 22, 31],   [199, 240, 216]],
    tile:  [[25, 30, 42],   [184, 222, 198]],
    glow:  [[25, 211, 162], [152, 186, 164]],
    logo:  [[242, 244, 247],[67, 82, 61]],
    lit:   [[25, 211, 162], [67, 82, 61]],
    snake: [[127, 162, 255],[67, 82, 61]],
    food:  [[25, 211, 162], [67, 82, 61]]
  };
  var reduce = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  var touch = !!(window.matchMedia && matchMedia('(hover: none)').matches);

  var RS = 2;                 // each logo pixel spans RS x RS tiles
  var RIPPLE_SPEED = 24, RIPPLE_WIDTH = 2.2, RIPPLE_LIFE = 2.8, AMBIENT_EVERY = 5, HOVER_FADE = 1.1;
  var AMBIENT_STEP = 0.13, GAME_STEP = 0.095, GAME_STEP_MIN = 0.055, SNAKE_LEN = 6;
  var oldTail = null, alpha = 1, moved = { x: 1, y: 0 };   // moved = direction of the last actual step   // last tail cell + progress between ticks, used to glide the snake

  var W, H, dpr, size, gap, pitch, cols, rows, ox, oy, Roc, Ror, litC, litR, kind, kidx, heat, c0, c1, r0, r1;
  var ripples = [], start = performance.now(), last = start, nextAmbient = 1.8, lastPt = null;
  var lcd = 0, lcdTarget = 0, rVis = 1, rVisTarget = 1;
  var mode = 'ambient', snake = [], dir = { x: 1, y: 0 }, queue = [], acc = 0, step = GAME_STEP;
  var seek = null, seekUntil = 0, nextSeek = 9, litGoneUntil = 0, litBackAt = -10;
  var food = null, score = 0, best = 0, dieAt = 0, hudTimer = null;
  try { best = parseInt(localStorage.getItem('rl-snake-best'), 10) || 0; } catch (e) {}

  function clock() { return (performance.now() - start) / 1000; }
  function at(c, r) { return r * cols + c; }
  function pick(pair) { var a = pair[0], b = pair[1]; return [a[0] + (b[0] - a[0]) * lcd, a[1] + (b[1] - a[1]) * lcd, a[2] + (b[2] - a[2]) * lcd]; }
  function blend(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
  function rgb(a) { return 'rgb(' + (a[0] | 0) + ',' + (a[1] | 0) + ',' + (a[2] | 0) + ')'; }
  function pad4(n) { return ('000' + n).slice(-4); }

  function layout() {
    W = window.innerWidth; H = window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    var p = Math.max(15, Math.min(30, W / 48));
    size = Math.round(p * 0.82); gap = Math.round(p) - size; pitch = size + gap;
    cols = Math.ceil(W / pitch) + 1; rows = Math.ceil(H / pitch) + 1;
    ox = Math.round((W - (cols * pitch - gap)) / 2);
    oy = Math.round((H - (rows * pitch - gap)) / 2);
    Roc = Math.max(1, cols - 5 * RS - Math.round(cols * 0.18));
    Ror = Math.max(1, Math.floor((rows - 7 * RS) / 2));
    litC = Roc + 3 * RS + (RS - 1) / 2; litR = Ror + (RS - 1) / 2;
    c0 = Math.max(0, Math.ceil(-ox / pitch)); c1 = Math.min(cols - 1, Math.floor((W - ox - size) / pitch));
    r0 = Math.max(0, Math.ceil(-oy / pitch)); r1 = Math.min(rows - 1, Math.floor((H - oy - size) / pitch));
    var n = cols * rows;
    kind = new Uint8Array(n); kidx = new Float32Array(n); heat = new Float32Array(n);
    var order = {}, k = 0;
    for (var pr = 0; pr < 7; pr++) for (var pc = 0; pc < 5; pc++) if (R[pr][pc] === 'X') order[pr * 5 + pc] = k++;
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        if (r < Ror || c < Roc) continue;
        var lr = Math.floor((r - Ror) / RS), lc = Math.floor((c - Roc) / RS);
        if (lr >= 7 || lc >= 5) continue;
        var ch = R[lr][lc], i = at(c, r);
        if (ch === 'X') { kind[i] = 1; kidx[i] = order[lr * 5 + lc]; }
        else if (ch === 'L') { kind[i] = 2; kidx[i] = 18; }
      }
    }
    buildSprites();
    if (mode !== 'ambient') endGame(true);
    resetSnake();
  }

  // Pre-rendered tile bitmaps: sprites[0] is the idle tile, sprites[LEVELS] is full mint.
  // baseCv holds the whole idle field, so each frame starts with one drawImage and then only
  // redraws the tiles that are currently glowing.
  var LEVELS = 32, INV_2W2 = 1 / (2 * RIPPLE_WIDTH * RIPPLE_WIDTH), sprites = [], baseCv = document.createElement('canvas');
  function buildSprites() {
    var px = Math.round(size * dpr), rad = size * 0.22 * dpr, tile = C.tile[0], glow = C.glow[0];
    sprites = [];
    for (var l = 0; l <= LEVELS; l++) {
      var s = document.createElement('canvas'); s.width = s.height = px;
      var g = s.getContext('2d');
      g.fillStyle = rgb(blend(tile, glow, l / LEVELS));
      g.beginPath();
      if (g.roundRect) g.roundRect(0, 0, px, px, rad); else g.rect(0, 0, px, px);
      g.fill();
      sprites.push(s);
    }
    baseCv.width = cv.width; baseCv.height = cv.height;
    var b = baseCv.getContext('2d');
    b.fillStyle = rgb(C.bg[0]); b.fillRect(0, 0, baseCv.width, baseCv.height);
    b.setTransform(dpr, 0, 0, dpr, 0, 0);
    for (var r = 0; r < rows; r++) for (var c = 0; c < cols; c++) b.drawImage(sprites[0], ox + c * pitch, oy + r * pitch, size, size);
  }

  // ---------- helpers ----------
  function cellAt(x, y) {
    var c = Math.floor((x - ox) / pitch), r = Math.floor((y - oy) / pitch);
    if (c < 0 || r < 0 || c >= cols || r >= rows) return -1;
    return at(c, r);
  }
  function wrapC(c) { return c < c0 ? c1 : c > c1 ? c0 : c; }
  function wrapR(r) { return r < r0 ? r1 : r > r1 ? r0 : r; }
  function onSnake(c, r, skipTail) {
    var n = snake.length - (skipTail ? 1 : 0);
    for (var i = 0; i < n; i++) if (snake[i].c === c && snake[i].r === r) return true;
    return false;
  }
  function free(c, r, skipTail) { return (mode === 'game' || kind[at(c, r)] === 0) && !onSnake(c, r, skipTail); }
  function nextCell(h, d) { return { c: wrapC(h.c + d.x), r: wrapR(h.r + d.y) }; }
  function coveredByPanel(c, r) {
    var x = ox + c * pitch, y = oy + r * pitch, els = document.querySelectorAll('.panel, .hud');
    for (var i = 0; i < els.length; i++) {
      if (els[i].hidden) continue;
      var b = els[i].getBoundingClientRect();
      if (x + size > b.left - 4 && x < b.right + 4 && y + size > b.top - 4 && y < b.bottom + 4) return true;
    }
    return false;
  }
  function resetSnake() {
    snake = []; dir = { x: 1, y: 0 }; moved = dir; queue = []; oldTail = null;
    for (var tries = 0; tries < 120; tries++) {
      var r = r0 + Math.floor(Math.random() * (r1 - r0 + 1));
      var c = c0 + SNAKE_LEN + Math.floor(Math.random() * Math.max(1, c1 - c0 - SNAKE_LEN * 2));
      var ok = true;
      for (var j = 0; j < SNAKE_LEN; j++) if (c - j < c0 || kind[at(c - j, r)] !== 0) { ok = false; break; }
      if (!ok) continue;
      for (var s = 0; s < SNAKE_LEN; s++) snake.push({ c: c - s, r: r });
      return;
    }
  }
  function spawnFood() {
    for (var tries = 0; tries < 300; tries++) {
      var c = c0 + Math.floor(Math.random() * (c1 - c0 + 1)), r = r0 + Math.floor(Math.random() * (r1 - r0 + 1));
      if (free(c, r, false) && !coveredByPanel(c, r)) { food = { c: c, r: r }; return; }
    }
    food = null;
  }
  function addRipple(c, r, amp, t) {
    ripples.push({ c: c, r: r, t: t, amp: amp });
    if (ripples.length > 5) ripples.shift();   // at most 5 rings at once keeps the busiest frames cheap
  }

  // ---------- snake brains ----------
  var DIRS = [{ x: 1, y: 0 }, { x: -1, y: 0 }, { x: 0, y: 1 }, { x: 0, y: -1 }];
  function exits(cell) {
    var n = 0;
    for (var i = 0; i < 4; i++) { var q = nextCell(cell, DIRS[i]); if (free(q.c, q.r, true)) n++; }
    return n;
  }
  function moveTo(cell, grow) {
    snake.unshift(cell);
    oldTail = grow ? null : snake.pop();
    moved = dir;
  }
  function ambientStep(t) {
    if (!snake.length) { resetSnake(); return; }
    var head = snake[0];
    if (!seek && t >= nextSeek) {
      var bc = Roc + 3 * RS, br = Ror;
      var cands = [{ c: bc + RS, r: br }, { c: bc, r: br - 1 }, { c: bc + 1, r: br - 1 }];
      for (var k = 0; k < cands.length; k++) {
        var q = cands[k];
        if (q.c >= c0 && q.c <= c1 && q.r >= r0 && q.r <= r1 && kind[at(q.c, q.r)] === 0) { seek = q; seekUntil = t + 18; break; }
      }
      if (!seek) nextSeek = t + 15;
    }
    var opts = [];
    for (var i = 0; i < 4; i++) {
      var d = DIRS[i];
      if (d.x === -dir.x && d.y === -dir.y) continue;
      var n = nextCell(head, d);
      if (!free(n.c, n.r, true)) continue;
      opts.push({ d: d, n: n, ex: exits(n) });
    }
    if (!opts.length) { resetSnake(); return; }
    var good = opts.filter(function (o) { return o.ex > 0; });
    if (good.length) opts = good;
    var choice;
    if (seek) {
      opts.sort(function (a, b) {
        return (Math.abs(a.n.c - seek.c) + Math.abs(a.n.r - seek.r)) - (Math.abs(b.n.c - seek.c) + Math.abs(b.n.r - seek.r)) || Math.random() - 0.5;
      });
      choice = opts[0];
    } else {
      var straight = opts.filter(function (o) { return o.d === dir || (o.d.x === dir.x && o.d.y === dir.y); })[0];
      choice = straight && Math.random() < 0.84 ? straight : opts[Math.floor(Math.random() * opts.length)];
    }
    dir = choice.d;
    moveTo(choice.n, false);
    if (seek && choice.n.c === seek.c && choice.n.r === seek.r) {
      addRipple(litC, litR, 1.1, t);
      litGoneUntil = t + 1.6; litBackAt = t + 1.6;
      seek = null; nextSeek = t + 12 + Math.random() * 8;
    } else if (seek && t > seekUntil) {
      seek = null; nextSeek = t + 10;
    }
  }
  function gameStep(t) {
    while (queue.length && dir.x === moved.x && dir.y === moved.y) {   // one turn per step
      var nd = queue.shift();
      if (!(nd.x === -moved.x && nd.y === -moved.y) && !(nd.x === dir.x && nd.y === dir.y)) { dir = nd; break; }
    }
    var head = snake[0], n = nextCell(head, dir);
    var eat = food && n.c === food.c && n.r === food.r;
    if (onSnake(n.c, n.r, !eat)) { die(t); return; }
    moveTo(n, eat);
    if (eat) {
      score++;
      addRipple(food.c, food.r, 0.8, t);
      step = Math.max(GAME_STEP_MIN, step - 0.003);
      spawnFood();
      showHud();
    }
  }

  // ---------- game flow ----------
  function showHud(over) {
    clearTimeout(hudTimer);
    hud.hidden = false; hint.hidden = true;
    hudMain.textContent = over ? 'GAME OVER ' + pad4(score) : 'SCORE ' + pad4(score);
    hudSub.textContent = 'BEST ' + pad4(best) + (over ? '' : (touch ? ' · TAP TO QUIT' : ' · WASD/ARROWS · ESC TO QUIT'));
  }
  function startGame(d) {
    if (mode === 'dying') return;
    if (mode === 'game') { if (queue.length < 3) queue.push(d); return; }
    if (!snake.length) resetSnake();
    if (!snake.length) return;
    mode = 'game'; rVisTarget = 0; score = 0; step = GAME_STEP; acc = 0; queue = []; seek = null;
    if (!(d.x === -moved.x && d.y === -moved.y)) dir = d;
    spawnFood();
    showHud();
  }
  function die(t) {
    mode = 'dying'; dieAt = t;
    var h = snake[0]; addRipple(h.c, h.r, 1.3, t);
    if (score > best) { best = score; try { localStorage.setItem('rl-snake-best', String(best)); } catch (e) {} }
    showHud(true);
  }
  function endGame(immediate) {
    mode = 'ambient'; lcdTarget = 0; rVisTarget = 1; food = null; queue = []; acc = 0;
    resetSnake();
    if (immediate) { clearTimeout(hudTimer); hud.hidden = true; hint.hidden = false; }
    else { hudTimer = setTimeout(function () { hud.hidden = true; hint.hidden = false; }, 1600); }
    nextSeek = clock() + 6;
  }

  // ---------- drawing ----------
  function rrect(x, y, w, h, rad) {
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, rad);
    else {
      ctx.moveTo(x + rad, y); ctx.arcTo(x + w, y, x + w, y + h, rad); ctx.arcTo(x + w, y + h, x, y + h, rad);
      ctx.arcTo(x, y + h, x, y, rad); ctx.arcTo(x, y, x + w, y, rad); ctx.closePath();
    }
    ctx.fill();
  }
  // The snake is a path through cell centres: the head glides from the previous cell toward the
  // current one, the tail glides off the cell it is leaving, and the tiles are placed every `pitch`
  // pixels along that path. So every tile slides smoothly between ticks, corners included.
  function drawSnake() {
    var n = snake.length, half = size / 2;
    function ctr(cell) { return { x: ox + cell.c * pitch + half, y: oy + cell.r * pitch + half }; }
    function near(a, b) { return Math.abs(a.x - b.x) + Math.abs(a.y - b.y) <= pitch * 1.01; }
    function lerp(a, b, k) { return { x: a.x + (b.x - a.x) * k, y: a.y + (b.y - a.y) * k }; }
    var pts = [];
    if (n > 1) {
      var h0 = ctr(snake[0]), h1 = ctr(snake[1]);
      pts.push(near(h0, h1) ? lerp(h1, h0, alpha) : (alpha >= 0.5 ? h0 : h1));
      for (var q = 1; q < n; q++) pts.push(ctr(snake[q]));

        var ot = ctr(oldTail), tl = pts[pts.length - 1];

      }
    } else pts.push(ctr(snake[0]));
    var segs = [];
    for (var i = 0; i < pts.length - 1; i++) {
      var a = pts[i], b = pts[i + 1], len = Math.hypot(b.x - a.x, b.y - a.y);
      segs.push({ a: a, b: b, len: len, jump: len > pitch * 1.5 });
    }
    function sample(d) {
      for (var s = 0; s < segs.length; s++) {
        var g = segs[s];
        if (g.jump) continue;
        if (d <= g.len) return g.len ? lerp(g.a, g.b, d / g.len) : g.a;
        d -= g.len;
      }
      return pts[pts.length - 1];
    }
    var col = pick(C.snake);
    ctx.strokeStyle = rgb(col); ctx.lineWidth = size * 0.62; ctx.lineCap = 'butt'; ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (var j = 0; j < segs.length; j++) {
      if (segs[j].jump) ctx.moveTo(segs[j].b.x, segs[j].b.y); else ctx.lineTo(segs[j].b.x, segs[j].b.y);
    }
    ctx.stroke();
    var rad = size * 0.22;
    for (var k = n - 1; k >= 0; k--) {
      var p = sample(k * pitch);
      ctx.fillStyle = k === 0 ? rgb(blend(col, [255, 255, 255], 0.25)) : rgb(col);
      rrect(p.x - half, p.y - half, size, size, rad);
    }
  }

  function easeOutBack(x) { var c1b = 1.70158, c3 = c1b + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1b * Math.pow(x - 1, 2); }

  function frame(nowMs) {
    var t = (nowMs - start) / 1000, dt = Math.min(0.05, (nowMs - last) / 1000);
    last = nowMs;
    lcd += (lcdTarget - lcd) * Math.min(1, dt * 5);
    if (Math.abs(lcd - lcdTarget) < 0.002) lcd = lcdTarget;
    rVis += (rVisTarget - rVis) * Math.min(1, dt * (rVisTarget > rVis ? 4 : 7));
    if (Math.abs(rVis - rVisTarget) < 0.002) rVis = rVisTarget;

    if (!reduce && mode === 'ambient' && t >= nextAmbient) { addRipple(litC, litR, 0.55, t); nextAmbient = t + AMBIENT_EVERY; }
    ripples = ripples.filter(function (rp) { return t - rp.t < RIPPLE_LIFE; });

    var stepping = mode === 'game' || (mode === 'ambient' && !reduce && t > 2.4);
    alpha = 1;
    if (stepping) {
      acc += dt;
      var iv = mode === 'game' ? step : AMBIENT_STEP;
      while (acc >= iv && (mode === 'game' || mode === 'ambient')) {
        acc -= iv;
        if (mode === 'game') gameStep(t); else ambientStep(t);
      }
      if (mode === 'game' || mode === 'ambient') alpha = Math.min(1, acc / (mode === 'game' ? step : AMBIENT_STEP));
    }
    if (mode === 'dying' && t - dieAt > 1.3) { endGame(false); resetSnake(); }

    // 1. the quiet field is a cached bitmap: one blit instead of ~1,500 tile draws
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(baseCv, 0, 0);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // 2. only tiles that are lit by hover or inside a ripple ring get redrawn, from pre-rendered sprites
    var rps = [];
    for (var j = 0; j < ripples.length; j++) {
      var rp0 = ripples[j], age = t - rp0.t, rr = age * RIPPLE_SPEED, band = RIPPLE_WIDTH * 2.6;
      var inner = Math.max(0, rr - band), outer = rr + band;
      rps.push({ c: rp0.c, r: rp0.r, rr: rr, k: rp0.amp * (1 - age / RIPPLE_LIFE) * 0.75, in2: inner * inner, out2: outer * outer });
    }
    var decay = dt / HOVER_FADE, skipR = rVis >= 0.999, nr = rps.length;
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        var i = r * cols + c;
        if (skipR && kind[i] !== 0) continue;
        var v = heat[i];
        if (v > 0) { v = Math.max(0, v - decay); heat[i] = v; }
        var w = 0;
        for (var q = 0; q < nr; q++) {
          var rp = rps[q], dx = c - rp.c, dy = r - rp.r, d2 = dx * dx + dy * dy;
          if (d2 < rp.in2 || d2 > rp.out2) continue;
          var dd = Math.sqrt(d2) - rp.rr;
          w += rp.k * Math.exp(-dd * dd * INV_2W2);
        }
        var a = v + w;
        if (a < 0.03) continue;
        var lvl = Math.round(Math.min(1, a) * LEVELS);
        if (lvl > 0) ctx.drawImage(sprites[lvl], ox + c * pitch, oy + r * pitch, size, size);
      }
    }
    var round = 1, block = RS * pitch - gap, litCol = pick(C.lit), logo = pick(C.logo);
    // second pass: the logo's big pixels always sit on top of the field
    for (var lr2 = 0; lr2 < 7 && rVis > 0.01; lr2++) {
      for (var lc2 = 0; lc2 < 5; lc2++) {
        if (R[lr2][lc2] === '.') continue;
        var r = Ror + lr2 * RS, c = Roc + lc2 * RS, i = r * cols + c, x = ox + c * pitch, y = oy + r * pitch;
        {
          var p = reduce ? 1 : Math.min(1, Math.max(0, (t - 0.25 - kidx[i] * 0.055) / 0.45));
          if (p <= 0) continue;
          var s = (reduce ? 1 : easeOutBack(p)) * (rVisTarget > 0 ? easeOutBack(rVis) : rVis);
          if (kind[i] === 2) {
            if (t < litGoneUntil) continue;
            if (t - litBackAt < 0.45) s *= easeOutBack(Math.max(0.01, (t - litBackAt) / 0.45));
            if (!reduce && mode === 'ambient' && t > 2 && Math.floor((t - 2) / 0.55) % 2 === 1) continue;
            ctx.fillStyle = rgb(litCol);
          } else {
            ctx.fillStyle = rgb(logo);
          }
          var sz = block * s, off = (block - sz) / 2;
          ctx.globalAlpha = Math.min(1, p * 2) * Math.min(1, rVis * 1.5);
          rrect(x + off, y + off, sz, sz, block * 0.2 * round * s);
          ctx.globalAlpha = 1;
        }
      }
    }

    if (food) {
      var fc = pick(C.food), fs = size * (0.62 + (1 - lcd) * 0.08 * Math.sin(t * 6));
      ctx.fillStyle = rgb(fc);
      rrect(ox + food.c * pitch + (size - fs) / 2, oy + food.r * pitch + (size - fs) / 2, fs, fs, fs * 0.25 * round);
    }

    var showSnake = snake.length && (mode !== 'ambient' || (!reduce && t > 2.4));
    if (showSnake && !(mode === 'dying' && Math.floor((t - dieAt) / 0.15) % 2 === 1)) drawSnake();
    requestAnimationFrame(frame);
  }

  // ---------- input ----------
  function light(x, y) { var i = cellAt(x, y); if (i >= 0 && (kind[i] === 0 || mode === 'game')) heat[i] = 1; }
  function trail(x, y) {
    if (lastPt && Math.hypot(x - lastPt.x, y - lastPt.y) < pitch * 8) {
      var dx = x - lastPt.x, dy = y - lastPt.y, steps = Math.min(40, Math.ceil(Math.hypot(dx, dy) / (pitch * 0.4)));
      for (var s = 1; s <= steps; s++) light(lastPt.x + dx * s / steps, lastPt.y + dy * s / steps);
    } else light(x, y);
    lastPt = { x: x, y: y };
  }
  window.addEventListener('pointermove', function (e) { if (e.pointerType === 'mouse') trail(e.clientX, e.clientY); }, { passive: true });
  document.addEventListener('mouseleave', function () { lastPt = null; });
  window.addEventListener('pointerdown', function (e) {
    if (mode !== 'ambient') return;   // no tap ripples while the game is running
    if (e.target.closest && e.target.closest('a, button')) return;
    var i = cellAt(e.clientX, e.clientY);
    if (i < 0) return;
    addRipple(i % cols, Math.floor(i / cols), 1, clock());
    if (kind[i] === 0) heat[i] = 1;
    lastPt = { x: e.clientX, y: e.clientY };
  }, { passive: true });

  var KEYS = {
    ArrowUp: { x: 0, y: -1 }, ArrowDown: { x: 0, y: 1 }, ArrowLeft: { x: -1, y: 0 }, ArrowRight: { x: 1, y: 0 },
    w: { x: 0, y: -1 }, s: { x: 0, y: 1 }, a: { x: -1, y: 0 }, d: { x: 1, y: 0 },
    W: { x: 0, y: -1 }, S: { x: 0, y: 1 }, A: { x: -1, y: 0 }, D: { x: 1, y: 0 }
  };
  window.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var el = document.activeElement;
    if (el && el !== document.body && el !== cv && el !== hud) return;
    if (e.key === 'Escape') { if (mode === 'game') endGame(false); return; }
    var d = KEYS[e.key];
    if (!d) return;
    e.preventDefault();
    startGame(d);
  });
  hud.addEventListener('click', function () { if (mode === 'game') endGame(false); });

  // Swipes turn as soon as the finger has travelled far enough, so one finger can keep steering
  // without lifting; the anchor resets after each turn.
  var swipe = null, SWIPE_MIN = 22;
  window.addEventListener('touchstart', function (e) {
    if (e.target.closest && e.target.closest('a, button')) { swipe = null; return; }
    var p = e.touches[0]; swipe = { x: p.clientX, y: p.clientY };
  }, { passive: true });
  window.addEventListener('touchmove', function (e) {
    if (!swipe) return;
    var p = e.touches[0], dx = p.clientX - swipe.x, dy = p.clientY - swipe.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < SWIPE_MIN) return;
    startGame(Math.abs(dx) > Math.abs(dy) ? { x: dx > 0 ? 1 : -1, y: 0 } : { x: 0, y: dy > 0 ? 1 : -1 });
    swipe = { x: p.clientX, y: p.clientY };
  }, { passive: true });
  window.addEventListener('touchend', function () { swipe = null; }, { passive: true });
  window.addEventListener('touchcancel', function () { swipe = null; }, { passive: true });

  document.getElementById('hint-desk').hidden = touch;
  document.getElementById('hint-touch').hidden = !touch;

  var rt;
  window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(layout, 120); });

  layout();
  requestAnimationFrame(frame);
  document.getElementById('yr').textContent = new Date().getFullYear();
})();
</script>
</body>
</html>
