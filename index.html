<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--ink:#12161F;--mint:#19D3A2;--fg:#F2F4F7;--muted:#ACB7CD}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink)}
body{position:relative;min-height:100vh;min-height:100dvh;overflow:hidden;color:var(--fg);font-family:'JetBrains Mono',ui-monospace,monospace;font-size:14px;display:flex;flex-direction:column;justify-content:space-between;gap:24px;padding:24px;-webkit-tap-highlight-color:transparent}
@media (max-width:600px){body{padding:16px}}
a{color:inherit}
#field{position:fixed;inset:0;z-index:0;display:block;touch-action:manipulation}
.top,.bottom{position:relative;z-index:1;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;pointer-events:none}
.top{align-items:flex-start}
.panel{pointer-events:auto;background:var(--ink);border-radius:12px;padding:10px 14px}
.word{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:20px;letter-spacing:-.01em;font-weight:800;margin:0}
.word span{font-weight:500}
.about{display:flex;flex-direction:column;gap:4px}
.about p{margin:0;font-size:16px;line-height:1.45}
.about small{font-size:13px;color:var(--muted)}
.mail{display:inline-block;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:clamp(22px,2.6vw,32px);letter-spacing:-.02em;text-decoration:underline;text-decoration-color:var(--mint);text-decoration-thickness:3px;text-underline-offset:6px}
.mail:hover,.mail:focus-visible{text-decoration-color:#fff}
.fade{animation:fade .9s ease-out 1.6s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}
</style>
</head>
<body>
<canvas id="field" aria-hidden="true"></canvas>
<header class="top fade">
<h1 class="word panel">Rezaberi <span>Labs</span></h1>
</header>
<footer class="bottom fade">
<div class="about panel">
<p>Thoughtful solutions, happier people.</p>
<small>© <span id="yr">2026</span> Rezaberi Labs LLC</small>
</div>
<div class="panel"><a class="mail" href="mailto:hello@rezaberi.com">hello@rezaberi.com</a></div>
</footer>
<script>
(function () {
  'use strict';
  var cv = document.getElementById('field');
  var ctx = cv.getContext('2d');
  var R = ['XXXL.', 'X...X', 'X...X', 'XXXX.', 'X.X..', 'X..X.', 'X...X'];
  var BASE = [27, 32, 45], MINT = [25, 211, 162], FG = [242, 244, 247];
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  var RIPPLE_SPEED = 13;     // cells per second
  var RIPPLE_WIDTH = 1.3;    // cells
  var RIPPLE_LIFE = 2.8;     // seconds
  var AMBIENT_EVERY = 5;     // seconds
  var HOVER_FADE = 1.1;      // seconds for a lit tile to fade out

  var W, H, dpr, size, gap, pitch, cols, rows, ox, oy, litC, litR, kind, kidx, heat;
  var ripples = [], start = performance.now(), last = start, nextAmbient = 1.8;
  var lastPt = null;

  function layout() {
    W = window.innerWidth; H = window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    var p = Math.max(26, Math.min(64, W / 24));
    size = Math.round(p * 0.86); gap = Math.round(p) - size; pitch = size + gap;
    cols = Math.ceil(W / pitch) + 1; rows = Math.ceil(H / pitch) + 1;
    ox = Math.round((W - (cols * pitch - gap)) / 2);
    oy = Math.round((H - (rows * pitch - gap)) / 2);
    var oc = Math.max(1, cols - 5 - Math.round(cols * 0.18));
    var or = Math.max(1, Math.floor((rows - 7) / 2));
    litC = oc + 3; litR = or;
    var n = cols * rows;
    kind = new Uint8Array(n); kidx = new Float32Array(n);
    heat = new Float32Array(n);
    var k = 0;
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        var lr = r - or, lc = c - oc, i = r * cols + c;
        if (lr >= 0 && lr < 7 && lc >= 0 && lc < 5) {
          var ch = R[lr][lc];
          if (ch === 'X') { kind[i] = 1; kidx[i] = k++; }
          else if (ch === 'L') { kind[i] = 2; kidx[i] = 18; }
        }
      }
    }
  }

  function cellAt(x, y) {
    var c = Math.floor((x - ox) / pitch), r = Math.floor((y - oy) / pitch);
    if (c < 0 || r < 0 || c >= cols || r >= rows) return -1;
    return r * cols + c;
  }

  function light(x, y) {
    var i = cellAt(x, y);
    if (i >= 0 && kind[i] === 0) heat[i] = 1;
  }

  function trail(x, y) {
    if (lastPt && Math.hypot(x - lastPt.x, y - lastPt.y) < pitch * 8) {
      var dx = x - lastPt.x, dy = y - lastPt.y;
      var steps = Math.min(40, Math.ceil(Math.hypot(dx, dy) / (pitch * 0.4)));
      for (var s = 1; s <= steps; s++) light(lastPt.x + dx * s / steps, lastPt.y + dy * s / steps);
    } else {
      light(x, y);
    }
    lastPt = { x: x, y: y };
  }

  function addRipple(c, r, amp, t) {
    ripples.push({ c: c, r: r, t: t, amp: amp });
    if (ripples.length > 12) ripples.shift();
  }

  function easeOutBack(x) {
    var c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
  }

  function rrect(x, y, w, h, rad) {
    ctx.beginPath();
    if (ctx.roundRect) { ctx.roundRect(x, y, w, h, rad); }
    else {
      ctx.moveTo(x + rad, y); ctx.arcTo(x + w, y, x + w, y + h, rad); ctx.arcTo(x + w, y + h, x, y + h, rad);
      ctx.arcTo(x, y + h, x, y, rad); ctx.arcTo(x, y, x + w, y, rad); ctx.closePath();
    }
    ctx.fill();
  }

  function mix(a, b, t) {
    return 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * t) + ',' + Math.round(a[1] + (b[1] - a[1]) * t) + ',' + Math.round(a[2] + (b[2] - a[2]) * t) + ')';
  }

  function frame(now) {
    var t = (now - start) / 1000;
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;

    if (!reduce && t >= nextAmbient) { addRipple(litC, litR, 0.55, t); nextAmbient = t + AMBIENT_EVERY; }
    ripples = ripples.filter(function (rp) { return t - rp.t < RIPPLE_LIFE; });

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#12161F';
    ctx.fillRect(0, 0, W, H);

    var rad = size * 0.22, decay = dt / HOVER_FADE;
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        var i = r * cols + c, x = ox + c * pitch, y = oy + r * pitch;
        if (kind[i] === 0) {
          var v = heat[i];
          if (v > 0) heat[i] = Math.max(0, v - decay);
          var w = 0;
          for (var j = 0; j < ripples.length; j++) {
            var rp = ripples[j], age = t - rp.t;
            var d = Math.hypot(c - rp.c, r - rp.r) - age * RIPPLE_SPEED;
            w += rp.amp * (1 - age / RIPPLE_LIFE) * Math.exp(-(d * d) / (2 * RIPPLE_WIDTH * RIPPLE_WIDTH));
          }
          var a = Math.min(1, Math.max(v, 0) + w * 0.75);
          ctx.fillStyle = a > 0.003 ? mix(BASE, MINT, a) : 'rgb(27,32,45)';
          rrect(x, y, size, size, rad);
        } else {
          var p = reduce ? 1 : Math.min(1, Math.max(0, (t - 0.25 - kidx[i] * 0.055) / 0.45));
          if (p <= 0) continue;
          var s = reduce ? 1 : easeOutBack(p);
          if (kind[i] === 2) {
            if (!reduce && t > 2 && Math.floor((t - 2) / 0.55) % 2 === 1) continue;
            ctx.fillStyle = mix(MINT, MINT, 0);
          } else {
            ctx.fillStyle = mix(FG, FG, 0);
          }
          var sz = size * s, off = (size - sz) / 2;
          ctx.globalAlpha = Math.min(1, p * 2);
          rrect(x + off, y + off, sz, sz, rad * s);
          ctx.globalAlpha = 1;
        }
      }
    }
    requestAnimationFrame(frame);
  }

  window.addEventListener('pointermove', function (e) {
    if (e.pointerType === 'mouse' || e.buttons) trail(e.clientX, e.clientY);
  }, { passive: true });
  window.addEventListener('pointerleave', function () { lastPt = null; });
  document.addEventListener('mouseleave', function () { lastPt = null; });
  window.addEventListener('pointerdown', function (e) {
    if (e.target.closest && e.target.closest('a')) return;
    var i = cellAt(e.clientX, e.clientY);
    if (i < 0) return;
    var t = (performance.now() - start) / 1000;
    addRipple(i % cols, Math.floor(i / cols), 1, t);
    if (kind[i] === 0) heat[i] = 1;
    lastPt = { x: e.clientX, y: e.clientY };
  }, { passive: true });
  window.addEventListener('pointerup', function (e) { if (e.pointerType !== 'mouse') lastPt = null; });

  var rt;
  window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(layout, 120); });

  layout();
  requestAnimationFrame(frame);
  document.getElementById('yr').textContent = new Date().getFullYear();
})();
</script>
</body>
</html>
