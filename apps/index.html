<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apps · Rezaberi Labs</title>
<meta name="theme-color" content="#12161F">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--ink:#12161F;--mint:#19D3A2;--fg:#F2F4F7;--muted:#ACB7CD}
html,body{margin:0;background:var(--ink);color:var(--fg)}
body{min-height:100vh;min-height:100dvh;padding:24px;box-sizing:border-box;font:14px 'JetBrains Mono',ui-monospace,monospace;display:flex;flex-direction:column;gap:48px}
a{color:inherit}
.word{font:800 20px 'Bricolage Grotesque',system-ui,sans-serif;letter-spacing:-.01em;text-decoration:none}
.word span{font-weight:500}
h1{font:800 clamp(32px,5vw,56px)/1 'Bricolage Grotesque',system-ui,sans-serif;letter-spacing:-.02em;margin:0 0 24px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:12px;max-width:560px}
li a{display:block;padding:16px 18px;border:1px solid #2A3140;border-radius:12px;text-decoration:none}
li a:hover,li a:focus-visible{border-color:var(--mint)}
li strong{display:block;font:800 22px 'Bricolage Grotesque',system-ui,sans-serif;margin-bottom:4px}
li span{color:var(--muted)}
</style>
</head>
<body>
<a class="word" href="/">Rezaberi <span>Labs</span></a>
<main>
<h1>Apps</h1>
<ul>
<li><a href="/apps/pokelab/"><strong>Poke Lab</strong><span>Build, test and battle VGC doubles teams on iPhone. Coming soon.</span></a></li>
</ul>
</main>
</body>
</html>
